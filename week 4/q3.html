<!DOCTYPE html>
<html>
<head>
    <title>Colored Specific Cells</title>
    <style>
        table {
            border-collapse: collapse;
            width: 400px;
            text-align: center;
        }

        td {
            border: 1px solid gray;
            padding: 8px;
            font-weight: bold;
        }

        /* Color only selected cells */
        .highlight {
            background-color: lightgray;
        }
    </style>
</head>
<body>

<table align="center">
    <tr>
        <td>1</td>
        <td class="highlight">2</td>
        <td>3</td>
        <td>4</td>
    </tr>
    <tr>
        <td class="highlight">5</td>
        <td colspan="2" rowspan="2">Image</td>
        <td class="highlight">6</td>
    </tr>
    <tr>
        <td>7</td>
        <td>8</td>
    </tr>
    <tr>
        <td>9</td>
        <td class="highlight">10</td>
        <td>11</td>
        <td>12</td>
    </tr>
</table>

</body>
</html>
